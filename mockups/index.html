<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Poop Shooter FPS — Mockups</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, sans-serif;
      background: #1a1208;
      color: #f5e6c8;
      padding: 2rem;
      line-height: 1.5;
    }
    h1 { text-align: center; margin-bottom: 0.25rem; color: #d4a574; }
    .subtitle { text-align: center; margin-bottom: 2rem; opacity: 0.8; }
    .grid {
      display: grid;
      gap: 2rem;
      max-width: 1200px;
      margin: 0 auto;
    }
    figure {
      background: #2a1a0c;
      border: 2px solid #6b4423;
      border-radius: 12px;
      overflow: hidden;
    }
    figcaption {
      padding: 1rem 1.25rem;
      font-weight: 600;
      font-size: 1.1rem;
      border-top: 1px solid #6b4423;
    }
    img {
      display: block;
      width: 100%;
      height: auto;
    }
    .paths {
      max-width: 1200px;
      margin: 2rem auto 0;
      padding: 1rem 1.25rem;
      background: #2a1a0c;
      border-radius: 8px;
      font-family: monospace;
      font-size: 0.85rem;
      word-break: break-all;
    }
  </style>
</head>
<body>
  <h1>💩 Poop Shooter FPS — Mockups</h1>
  <p class="subtitle">Concept art for menu, gameplay, and game over screens</p>

  <div class="grid">
    <figure>
      <img src="poop-fps-mockup-menu.png" alt="Title screen mockup" />
      <figcaption>1. Title Screen — Enter the Brown Zone</figcaption>
    </figure>
    <figure>
      <img src="poop-fps-mockup-gameplay.png" alt="Gameplay HUD mockup" />
      <figcaption>2. Gameplay — FPS view with HUD and enemies</figcaption>
    </figure>
    <figure>
      <img src="poop-fps-mockup-gameover.png" alt="Game over screen mockup" />
      <figcaption>3. Game Over — You Got Flushed!</figcaption>
    </figure>
  </div>

  <div class="paths">
    Files: ~/Projects/poop-fps/mockups/*.png
  </div>
</body>
</html>
